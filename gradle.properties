# Project-wide Gradle settings.
# Kotlin/Native links the iOS release framework inside the Gradle daemon, which needs the extra room
# when the Android release build ran first on the same daemon.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
