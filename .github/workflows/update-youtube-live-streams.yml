# Refreshes the NASA live-stream JSON the apps read from the live-stream-cache branch: the streams live now, and
# the scheduled ones the apps alert users about. The one workflow on a
# GitHub-hosted runner: it has to keep running while the owner's Mac is closed, it's a few seconds of Node with
# no build, and hosted runners are free for public repositories. Everything else stays on the Mac
# (see docs/ci-runners.md).
name: Update YouTube Live Streams

on:
  schedule:
    # GitHub delays and drops scheduled runs under load; this one has been starting only every 2-5 hours.
    # The apps show the last published list however old it is.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Only for the keep-alive step below, which re-enables this workflow.
  actions: write

# GitHub keeps only the newest pending run, so a slow run never builds up a backlog.
concurrency:
  group: update-youtube-live-streams
  cancel-in-progress: false

jobs:
  update-live-streams:
    name: Update live stream JSON
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        # Its own checkout folder, so switching to live-stream-cache never touches the mobile builds' checkout.
        working-directory: live-streams

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: live-streams

      - name: Restore previous live stream JSON
        run: |
          git fetch origin refs/heads/live-stream-cache:refs/remotes/origin/live-stream-cache || true
          if git show origin/live-stream-cache:docs/nasa-live-streams.json > docs/nasa-live-streams.json 2>/dev/null; then
            echo "Restored previous live stream JSON from live-stream-cache."
          else
            echo "No previous live stream JSON found."
          fi

      # Uses the Node that GitHub's Ubuntu image ships with (the script needs only the built-in fetch).
      - name: Fetch YouTube live stream status
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Manual runs always do a full search; scheduled runs use cheap checks between searches.
          FORCE_FULL_SEARCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: node .github/scripts/update-youtube-live-streams.js

      - name: Commit live stream JSON
        run: |
          cache_branch="live-stream-cache"
          cache_file="docs/nasa-live-streams.json"
          temp_json="$(mktemp)"
          remote_branch_exists="false"

          cp "$cache_file" "$temp_json"
          git reset --hard
          git clean -fd

          # -C resets the local branch left by the previous run on this persistent checkout.
          if git show-ref --verify --quiet "refs/remotes/origin/$cache_branch"; then
            remote_branch_exists="true"
            git switch -C "$cache_branch" "origin/$cache_branch"
          else
            git branch -D "$cache_branch" 2>/dev/null || true
            git switch --orphan "$cache_branch"
            git rm -rf . || true
          fi

          mkdir -p "$(dirname "$cache_file")"
          cp "$temp_json" "$cache_file"
          rm -f "$temp_json"

          if [ "$remote_branch_exists" = "true" ] && git diff --quiet -- "$cache_file"; then
            echo "No live stream status changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$cache_file"
          git commit -m "Update NASA live stream status [skip ci]"
          git push -u origin "$cache_branch"

      # GitHub switches off scheduled workflows in public repositories after 60 days without repository
      # activity. Re-enabling this one on every run resets that clock, so live-event alerts keep their data.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update-youtube-live-streams.yml/enable"
