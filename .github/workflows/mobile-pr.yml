name: Mobile PR Checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: mobile-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-mobile-apps:
    name: Build Android and iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          for xcode_app in /Applications/Xcode_26*.app /Applications/Xcode-26*.app /Applications/Xcode.app; do
            [ -d "$xcode_app" ] || continue
            developer_dir="$xcode_app/Contents/Developer"
            xcode_version_output="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version 2>&1 || true)"
            if printf '%s\n' "$xcode_version_output" | grep -q '^Xcode 26'; then
              export DEVELOPER_DIR="$developer_dir"
              echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
              printf '%s\n' "$xcode_version_output"
              printf 'iOS SDK %s\n' "$(xcrun --sdk iphoneos --show-sdk-version)"
              exit 0
            fi
          done

          echo "Xcode 26 with the iOS 26 SDK is required but was not found."
          ls -1 /Applications/Xcode*.app || true
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Load app version
        run: bash tools/ci/load-app-version.sh

      - name: Configure iOS runtime API key
        if: env.N2YO_API_KEY != ''
        run: printf 'ISS_TRACKER_N2YO_API_KEY = %s\n' "$N2YO_API_KEY" > iosApp/Configuration/Local.xcconfig

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: iss-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml

      - name: Compile shared iOS code
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/ISSTrackerIOS.xcodeproj \
            -scheme ISSTrackerIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS release app
        if: github.event_name == 'workflow_dispatch'
        run: |
          xcodebuild \
            -project iosApp/ISSTrackerIOS.xcodeproj \
            -scheme ISSTrackerIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
