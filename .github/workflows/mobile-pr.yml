name: Mobile PR Checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: mobile-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-mobile-apps:
    name: Build Android and iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Load app version
        run: bash tools/ci/load-app-version.sh

      - name: Configure iOS runtime API key
        if: env.N2YO_API_KEY != ''
        run: printf 'ISS_TRACKER_N2YO_API_KEY = %s\n' "$N2YO_API_KEY" > iosApp/Configuration/Local.xcconfig

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: iss-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml

      - name: Compile shared iOS code
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/ISSTrackerIOS.xcodeproj \
            -scheme ISSTrackerIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS release app
        if: github.event_name == 'workflow_dispatch'
        run: |
          xcodebuild \
            -project iosApp/ISSTrackerIOS.xcodeproj \
            -scheme ISSTrackerIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
