name: iOS CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Load app version
        run: bash tools/ci/load-app-version.sh

      - name: Configure iOS runtime API key
        if: env.N2YO_API_KEY != ''
        run: printf 'ISS_TRACKER_N2YO_API_KEY = %s\n' "$N2YO_API_KEY" > iosApp/Configuration/Local.xcconfig

      - name: Require production API key on protected pushes
        if: github.event_name == 'push'
        run: test -n "$N2YO_API_KEY"

      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml

      - name: Compile shared iOS code
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/ISSTrackerIOS.xcodeproj \
            -scheme ISSTrackerIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS release app
        if: github.event_name == 'push'
        run: |
          xcodebuild \
            -project iosApp/ISSTrackerIOS.xcodeproj \
            -scheme ISSTrackerIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
